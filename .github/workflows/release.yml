name: Archive téléchargeable
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Vérifier la version du tag
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - run: npm run check
      # Use the same bounded file concurrency as branch verification.
      - run: node --test --test-concurrency=2 test/*.test.mjs
      - run: python -B test/comfy-memory-node.test.py
      - run: npm run check:export
      - run: npm run release
      - name: Préparer les notes de version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).slice(1).find(text => text.startsWith(pkg.version + ' '));
          if (!section) throw new Error('Notes absentes pour la version du tag.');
          const changes = section.slice(section.indexOf('\n') + 1).trim().replace(/\]\((docs\/[^)]+)\)/g, (_, target) => '](https://github.com/Shaft1942/bionic_local_server/blob/v' + pkg.version + '/' + target + ')');
          const archive = 'bionic-mobile-v' + pkg.version + '.zip';
          const notes = '## Installation Windows\n\nTéléchargez **' + archive + '** ci-dessous, extrayez entièrement le ZIP puis double-cliquez sur **Installer.cmd**. L’assistant détecte Node.js ou propose son téléchargement portable avec votre accord. Bionic doit être installé séparément.\n\n## Nouveautés\n\n' + changes + '\n\n## Mise à jour\n\nDepuis 1.9.0, utilisez les mises à jour proposées dans le compagnon. Les installations plus anciennes suivent la procédure manuelle du README, avec sauvegarde des données. Node.js 24 minimum ; le runtime portable n’est pas inclus dans le ZIP.\n\nL’archive ne contient ni conversations, ni clés, ni configuration personnelle. SHA256SUMS.txt et update-manifest.json sont joints pour le contrôle de l’archive et de sa compatibilité.\n';
          fs.writeFileSync('dist/RELEASE_NOTES.md', notes);
          NODE
      - name: Publier le ZIP et son empreinte
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt dist/update-manifest.json --verify-tag --title "Bionic Mobile $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
